name: ci

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.15
          cache: true
          install_args: >-
            rust@1.99.1 rust@1.96.0 just cargo:cargo-nextest cargo:cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          key: ci-rust
      - name: Check the declared Rust compatibility floor
        run: mise x -- rustup run 1.96.0 just check
      - run: just ci-rust

  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve canonical playground UI commit
        id: playground-ui-lock
        run: |
          commit="$(jq -er '.upstreamCommit' playground/vendor/playground-ui.lock.json)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: P4suta/aozora
          ref: ${{ steps.playground-ui-lock.outputs.commit }}
          path: .upstream-aozora
          fetch-depth: 1
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.15
          cache: true
          install_args: >-
            rust@1.99.1 bun node just cargo:wasm-pack npm:binaryen
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          key: ci-web
      - name: Build WASM and install web dependencies
        run: just playground-install
      - name: Install Playwright system dependencies
        working-directory: playground
        run: bun x --no-install playwright install --with-deps chromium firefox webkit
      - name: Install deterministic screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-core fonts-takao-gothic
      - name: Verify canonical playground UI snapshot
        working-directory: playground
        run: bun run vendor:verify -- ../.upstream-aozora
      - run: just ci-web
      - name: Upload web test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-test-reports-${{ github.sha }}
          path: |
            playground/playwright-report/
            playground/test-results/
          retention-days: 7
          if-no-files-found: ignore

  repo:
    name: repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.15
          cache: true
          install_args: >-
            rust@1.99.1 just cargo:cargo-deny actionlint shellcheck zizmor
            github:crate-ci/typos
      - run: just ci-repo

  ci-success:
    name: ci-success
    if: always()
    needs: [rust, web, repo]
    runs-on: ubuntu-latest
    steps:
      - name: Require every fixed CI job
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::a required CI job failed, was cancelled, or was skipped"
          exit 1
      - run: echo "ci-success"

  # The one status check branch protection requires,
  # named the same in every P4suta repository.
  # It passes only when every job it needs succeeded or was skipped.
  required:
    name: required
    if: always()
    needs: [ci-success]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'all(.[]; IN("success", "skipped"))' <<< "${RESULTS}"
