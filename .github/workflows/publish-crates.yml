name: publish-crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (no upload)"
        type: boolean
        default: true
      skip_crates:
        description: "Comma-separated publishable package names already uploaded by an earlier attempt"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve canonical playground UI commit
        id: playground-ui-lock
        run: |
          commit="$(jq -er '.upstreamCommit' playground/vendor/playground-ui.lock.json)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: P4suta/aozora
          ref: ${{ steps.playground-ui-lock.outputs.commit }}
          path: .upstream-aozora
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.15
          cache: false
          install_args: >-
            rust@1.99.1 rust@1.96.0 rust@nightly-2026-07-15
            bun node just cargo:wasm-pack npm:binaryen
            cargo:cargo-nextest cargo:cargo-llvm-cov cargo:cargo-deny
            cargo:cargo-dist cargo:cargo-release cargo:cargo-fuzz
            actionlint shellcheck zizmor github:crate-ci/typos
      - name: Install browser and screenshot prerequisites
        run: |
          just playground-install
          cd playground
          bun x --no-install playwright install --with-deps chromium firefox webkit
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-core fonts-takao-gothic
      - name: Verify canonical playground UI snapshot
        working-directory: playground
        run: bun run vendor:verify -- ../.upstream-aozora
      - name: Verify the release source without publishing
        run: just ci-candidate
      - name: Upload failing web reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-quality-${{ github.sha }}
          path: |
            playground/playwright-report/
            playground/test-results/
            playground/.lighthouseci/reports/
          retention-days: 7
          if-no-files-found: ignore

  preflight:
    name: preflight
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.15
          cache: true
          install_args: >-
            rust@1.99.1 just cargo:cargo-semver-checks
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          key: publish-crates-preflight
      - run: just changelog-check
      - name: Dry-run the same crate selection as a live retry
        env:
          SKIP_CRATES: ${{ inputs.skip_crates }}
        run: just package-smoke "$SKIP_CRATES"
      - run: just semver

  publish:
    name: publish
    needs: preflight
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.15
          cache: true
          install_args: rust@1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          key: publish-crates-publish
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
      - name: Publish four crates in workspace dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          SKIP_CRATES: ${{ inputs.skip_crates }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          scripts/publish-excludes.sh "$SKIP_CRATES" > "$work/excludes"
          mapfile -t excludes < "$work/excludes"
          : > "$work/skipped"
          for ((i = 1; i < ${#excludes[@]}; i += 2)); do
            printf '%s\n' "${excludes[i]}" >> "$work/skipped"
          done
          cargo metadata --locked --no-deps --format-version 1 \
            > "$work/metadata.json"
          jq -r --rawfile skipped "$work/skipped" '
            ($skipped | split("\n") | map(select(length > 0))) as $skipped
            | .packages[]
            | select(.publish != [] and (.name as $name | $skipped | index($name) | not))
            | .name
          ' "$work/metadata.json" > "$work/selected"
          mapfile -t selected < "$work/selected"
          printf 'publish selected %d crate(s):\n' "${#selected[@]}"
          if (( ${#selected[@]} == 0 )); then
            printf '  (none)\n'
            echo "all publishable crates were skipped; nothing to publish"
            exit 0
          fi
          printf '  %s\n' "${selected[@]}"
          cargo publish --workspace --locked "${excludes[@]}"
