# PR area labels are applied by `.github/workflows/labeler.yml` from the paths a PR touches.
# Labels must already exist in the repository.
# Renovate owns dependency-update PRs; these rules add only path-based area labels.

"area: markdown":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/aozora-flavored-markdown/**"
          - "crates/aozora-flavored-markdown-test-support/**"

"area: cli":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/aozora-flavored-markdown-cli/**"

"area: wasm":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/aozora-flavored-markdown-wasm/**"
          - "playground/**"

"area: dev":
  - changed-files:
      - any-glob-to-any-file:
          - "Justfile"
          - "mise.toml"
          - "mise.lock"
          - ".cargo/**"
          - "rust-toolchain.toml"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"
