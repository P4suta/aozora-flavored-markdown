# Native development toolchain. `rust-toolchain.toml`, Cargo.lock and
# playground/bun.lock remain the language-specific sources of truth.
[settings]
lockfile = true

[tools]
rust = [
    { version = "1.99.0", profile = "minimal", components = ["clippy", "rustfmt", "rust-src", "llvm-tools-preview"], targets = ["wasm32-unknown-unknown"] },
    { version = "nightly-2026-07-15", profile = "minimal", components = ["rust-src"] },
]
bun = "1.4.2"
node = "24.21.0"
just = "1.58.0"
"cargo:wasm-pack" = "0.15.0"
"npm:binaryen" = "130.0.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.30.1"
"github:crate-ci/typos" = "v1.51.1"
"cargo:cargo-nextest" = "0.9.148"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-release" = "1.1.6"
"cargo:cargo-semver-checks" = "0.51.0"
"cargo:cargo-dist" = "0.32.0"
"cargo:git-cliff" = "2.14.2"
